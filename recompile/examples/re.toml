mode = "Vm"

[rules]
debounce_ms = 1500
confidence_hi = 0.8
confidence_lo = 0.5

[rules.cooldowns]
R-double-free = 0
R-memcpy-oob = 10000
R-uaf-hint = 5000
R-invalid-free = 5000

[escalation]
default_timeout = 120
max_total_budget = 600

[escalation.timeouts]
gdb = 60
valgrind = 300
asan = 120

[clustering]
window_s = 1.5
top_k = 3
enabled = true
max_clusters = 1000
confidence_merge_threshold = 0.8
similarity_threshold = 0.9

[symbolize]
enabled = true
max_frames = 5
redact_paths = [
    "/workspace",
    "/tmp",
]
