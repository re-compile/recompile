[workspace]
members = [
  "recc",
  "rerun",
  "protocols/mcp",
  "lsp",
  "re-rules",
  "re-crashpack",
  "re-escalate",
  "re-harness",
]

resolver = "2"

[workspace.package]
edition = "2021"
name = "recompile"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
which = "6"
libc = "0.2"
